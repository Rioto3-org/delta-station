apiVersion: batch/v1
kind: CronJob
metadata:
  name: delta-station-scraper
  namespace: delta-station
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid        # 前回実行が終わってなければスキップ
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: scraper
              image: delta-station-scraper:latest
              imagePullPolicy: Never
              env:
                - name: TZ
                  value: Asia/Tokyo
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
              volumeMounts:
                - name: outputs
                  mountPath: /app/outputs
          volumes:
            - name: outputs
              persistentVolumeClaim:
                claimName: delta-station-outputs
