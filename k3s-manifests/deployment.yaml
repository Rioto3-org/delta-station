apiVersion: apps/v1
kind: Deployment
metadata:
  name: delta-station-dashboard
  namespace: delta-station
  labels:
    app: delta-station-dashboard
spec:
  # Scale-to-Zero 運用: KEDA が 0 ↔ 1 を自動制御
  # 手動で起動したい場合: kubectl scale deployment delta-station-dashboard --replicas=1 -n delta-station
  replicas: 0
  selector:
    matchLabels:
      app: delta-station-dashboard
  template:
    metadata:
      labels:
        app: delta-station-dashboard
    spec:
      securityContext:
        runAsUser: 1000   # shine
        runAsGroup: 1000
        fsGroup: 1000     # PVCのファイルをshineグループ所有にする
      containers:
        - name: dashboard
          image: localhost:5000/delta-station-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          env:
            - name: TZ
              value: Asia/Tokyo
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PGHOST
              value: postgres.postgres-operabase.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: delta_station
            - name: PGUSER
              value: delta_worker
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: delta-pg-worker
                  key: PGPASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /delta-station/_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /delta-station/_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
